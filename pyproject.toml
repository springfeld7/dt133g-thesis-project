[project]
name = "transtructiver"
version = "0.1.0"
description = "This project delivers TranStructIVer: a modular and extensible software framework for automated semantics-preserving code transformation and verification."
readme = "README.md"
authors = [
    { name = "Loviza Sahlén", email = "losa2300@student.miun.se" },
    { name = "Thomas Springfeldt", email = "thsp1900@student.miun.se" }
]
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.8.5",
    "matplotlib>=3.10.8",
    "gdown>=6.0.0",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "torch",
    "transformers>=5.5.4",
    "tqdm>=4.67.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-python>=0.25.0",
    "accelerate>=1.13.0",
    "scikit-learn>=1.7.2",
    "datasketch>=1.10.0",
    "tensorboard>=2.20.0",
    "unidecode>=1.4.0",
]

[project.scripts]
transtructiver = "transtructiver:main"
cli = "transtructiver.cli:main"
mutate = "transtructiver.mutate:main"

# Preprocessing scripts
verify-login = "preprocessing.utils.dataset_manager:main"
step00 = "preprocessing._00_extract_datasets:run_step_00"
step01 = "preprocessing._01_normalize_datasets:run_step_01"
step02 = "preprocessing._02_deduplicate_exact:run_step_02"
step03 = "preprocessing._03_deduplicate_near:run_step_03"
step04 = "preprocessing._04_extract_stats:run_step_04"
step05 = "preprocessing._05_filter_datasets:run_step_05"
step06 = "preprocessing._06_generate_splits:run_step_06"
step07 = "preprocessing._07_map_gradient:main"

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | migrations
)/
'''

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black==24.1.0",
    "ipykernel>=7.2.0",
    "notebook>=7.5.5",
    "pytest>=9.0.2",
    "requests>=2.33.1",
]
